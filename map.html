<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Lokasi Bus</title>
<link rel="icon" href="data:,">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />

<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }
  #map { height: 100%; width: 100%; background: #eee; }
  #panel {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 10px 16px; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); text-align: center; max-width: 90%;
  }
  #panel button {
    padding: 10px 20px; font-size: 15px; background: #1a73e8; color: white;
    border: none; border-radius: 6px; cursor: pointer;
  }
  #lastUpdate { font-size: 12px; color: #555; margin-top: 6px; }
  #loadingMsg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 500; color: #888; font-size: 14px;
  }
</style>
</head>
<body>

<div id="panel">
  <button onclick="cekPosisiBus()">Cek Posisi Bus</button>
  <div id="lastUpdate">Belum dicek</div>
</div>
<div id="map"></div>
<div id="loadingMsg">Memuat peta...</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
// GANTI dengan URL Web App hasil deploy Apps Script kamu
var WEB_APP_URL = 'GANTI_DENGAN_URL_WEB_APP';

var map = null;
var markers = {};

function initMap() {
  if (typeof L === 'undefined') {
    document.getElementById('loadingMsg').innerText =
      'Gagal memuat library peta. Coba refresh halaman.';
    return;
  }

  document.getElementById('loadingMsg').style.display = 'none';

  map = L.map('map').setView([-8.1120, 115.0882], 12); // default: Buleleng, Bali

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  cekPosisiBus();
}

function cekPosisiBus() {
  if (!map) return;

  fetch(WEB_APP_URL + '?action=get')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.length) {
        document.getElementById('lastUpdate').innerText = 'Belum ada data lokasi bus';
        return;
      }

      data.forEach(function (bus) {
        var lat = parseFloat(bus.lat);
        var lng = parseFloat(bus.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        var popupText = bus.bus_id + (bus.driver_name ? ' - Supir: ' + bus.driver_name : '');

        if (markers[bus.bus_id]) {
          markers[bus.bus_id].setLatLng([lat, lng]);
          markers[bus.bus_id].setPopupContent(popupText);
        } else {
          markers[bus.bus_id] = L.marker([lat, lng])
            .addTo(map)
            .bindPopup(popupText);
        }
      });

      var first = data[0];
      map.flyTo([parseFloat(first.lat), parseFloat(first.lng)], map.getZoom(), {
        animate: true,
        duration: 1
      });
      setTimeout(function () { map.invalidateSize(); }, 300);

      document.getElementById('lastUpdate').innerText =
        'Terakhir dicek: ' + new Date().toLocaleTimeString();
    })
    .catch(function () {
      document.getElementById('lastUpdate').innerText = 'Gagal ambil data, cek koneksi internet';
    });
}

// tunggu semua resource kebaca sebelum init
window.addEventListener('load', initMap);
</script>

</body>
</html>
