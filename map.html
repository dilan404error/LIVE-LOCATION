<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Lokasi Bus</title>
<link rel="icon" href="data:,">

<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }
  #map { height: 100%; width: 100%; border: 0; }
  #panel {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 10px 16px; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); text-align: center; max-width: 90%;
  }
  #panel button {
    padding: 10px 20px; font-size: 15px; background: #1a73e8; color: white;
    border: none; border-radius: 6px; cursor: pointer;
  }
  #lastUpdate { font-size: 12px; color: #555; margin-top: 6px; }
  #busList { font-size: 13px; color: #333; margin-top: 8px; text-align: left; max-height: 120px; overflow-y: auto; }
  #busList div { padding: 4px 0; border-top: 1px solid #eee; }
  #busList button { padding: 4px 10px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>

<div id="panel">
  <button onclick="cekPosisiBus()">Cek Posisi Bus</button>
  <div id="lastUpdate">Belum dicek</div>
  <div id="busList"></div>
</div>

<iframe id="map" src="https://www.openstreetmap.org/export/embed.html?bbox=115.03%2C-8.15%2C115.15%2C-8.07&layer=mapnik"></iframe>

<script>
// GANTI dengan URL Web App hasil deploy Apps Script kamu
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbywB9lpr7iy87yQY3HxesGvxOSpMw0JnZGnag5AYoWqhTnvzkpF5pkzG6nNNkXeyM0G/exec';

var busData = [];

function tampilkanPeta(lat, lng) {
  var delta = 0.01;
  var bbox = (lng - delta) + '%2C' + (lat - delta) + '%2C' + (lng + delta) + '%2C' + (lat + delta);
  var src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bbox
           + '&layer=mapnik&marker=' + lat + '%2C' + lng;
  document.getElementById('map').src = src;
}

function cekPosisiBus() {
  fetch(WEB_APP_URL + '?action=get')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.length) {
        document.getElementById('lastUpdate').innerText = 'Belum ada data lokasi bus';
        document.getElementById('busList').innerHTML = '';
        return;
      }

      busData = data;

      var listHtml = '';
      data.forEach(function (bus, idx) {
        var label = bus.bus_id + (bus.driver_name ? ' - ' + bus.driver_name : '');
        listHtml += '<div>' + label + '<button onclick="tampilkanBus(' + idx + ')">Lihat</button></div>';
      });
      document.getElementById('busList').innerHTML = listHtml;

      var first = data[0];
      tampilkanPeta(parseFloat(first.lat), parseFloat(first.lng));

      document.getElementById('lastUpdate').innerText =
        'Terakhir dicek: ' + new Date().toLocaleTimeString();
    })
    .catch(function () {
      document.getElementById('lastUpdate').innerText = 'Gagal ambil data, cek koneksi internet';
    });
}

function tampilkanBus(idx) {
  var bus = busData[idx];
  if (!bus) return;
  tampilkanPeta(parseFloat(bus.lat), parseFloat(bus.lng));
}

cekPosisiBus(); // langsung cek sekali saat halaman dibuka
</script>

</body>
</html>
